<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Food Idea Planner | Foodology Feeding Therapy</title>
<meta name="description" content="Pick a food your child already loves and get ideas for serving it in new ways. A free tool from Foodology Feeding Therapy.">
<link rel="icon" href="assets/foodology-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --teal: #16332F;
    --teal-soft: #3E5551;
    --lime: #A8D93C;
    --orange: #FF810A;
    --cream: #EDEAE0;
    --card: #F7F5EE;
    --line: #D9D5C8;
    --display: 'Bricolage Grotesque', Georgia, serif;
    --body: 'Hanken Grotesk', 'Helvetica Neue', Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; background: var(--cream); color: var(--teal);
    font-family: var(--body); font-size: 17px; line-height: 1.5;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  a { color: var(--teal); }
  img { max-width: 100%; }
  :focus-visible { outline: 3px solid var(--orange); outline-offset: 3px; }
  .wrap { width: 100%; max-width: 1240px; margin: 0 auto; padding: 0 24px; }
  h1, h2, h3 { margin: 0; }

  /* Header */
  .site-header { border-bottom: 1px solid #CFCBBE; padding-top: env(safe-area-inset-top, 0px); }
  .site-header .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-top: 14px; padding-bottom: 14px; }
  .brand { display: flex; align-items: center; gap: 16px; text-decoration: none; }
  .brand img { height: 60px; width: auto; display: block; }
  .brand .divider { width: 1px; height: 38px; background: #CFCBBE; }
  .brand .tool { font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: -0.4px; }
  .header-link { font-size: 15px; font-weight: 600; }

  /* Buttons */
  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 26px; border: none; border-radius: 14px; font-family: var(--body); font-size: 17px; font-weight: 700; text-decoration: none; cursor: pointer; }
  .btn-lime { background: var(--lime); color: var(--teal); }
  .btn-lime:hover { background: #B7E356; }
  .btn-teal { background: var(--teal); color: var(--cream); }
  .btn-teal:hover { background: #0F2522; }

  /* Search */
  .search { display: flex; flex-direction: column; gap: 12px; }
  .search label { font-size: 15px; font-weight: 600; }
  .search-row { display: flex; gap: 12px; }
  .search input { flex: 1; min-width: 0; height: 56px; padding: 0 18px; font-family: var(--body); font-size: 18px; color: var(--teal); background: #fff; border: 2px solid var(--teal); border-radius: 14px; }
  .search-msg { margin: 0; padding: 16px 18px; background: #fff; border: 2px solid var(--orange); border-radius: 14px; font-size: 16px; }
  .search-msg a { font-weight: 700; }

  /* Home */
  .home-hero { padding: 56px 0 24px; }
  .home-hero h1 { font-family: var(--display); font-weight: 800; font-size: clamp(40px, 7vw, 76px); line-height: 0.98; letter-spacing: -1.5px; max-width: 14ch; }
  .home-hero p { max-width: 60ch; font-size: 19px; margin: 20px 0 32px; }
  .food-grid { list-style: none; margin: 32px 0 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
  .food-grid a { display: flex; flex-direction: column; justify-content: space-between; gap: 18px; min-height: 120px; padding: 20px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; text-decoration: none; }
  .food-grid a:hover { border-color: var(--teal); background: #fff; }
  .food-grid .name { font-family: var(--display); font-weight: 700; font-size: 24px; line-height: 1.1; }
  .food-grid .count { font-size: 14px; font-weight: 600; color: var(--teal-soft); }
  .free-note { margin: 20px 0 0; font-size: 15px; color: var(--teal-soft); }
  .free-note a { font-weight: 700; }

  /* Food page */
  .back { display: inline-block; margin-top: 28px; font-size: 15px; font-weight: 600; }
  .food-hero { margin-top: 20px; padding: clamp(32px, 5vw, 52px); background: var(--teal); color: var(--cream); border-radius: 28px; }
  .food-hero .kicker { font-size: 15px; font-weight: 700; color: var(--lime); }
  .food-hero h1 { font-family: var(--display); font-weight: 800; font-size: clamp(48px, 9vw, 92px); line-height: 0.95; letter-spacing: -2px; margin-top: 10px; }
  .food-hero p { max-width: 62ch; font-size: 19px; margin: 18px 0 0; }

  .nutri { margin-top: 32px; padding-top: 28px; border-top: 1px solid rgba(237, 234, 224, 0.25); }
  .nutri h2 { font-family: var(--display); font-weight: 700; font-size: 24px; letter-spacing: -0.3px; }
  .nutri ul { list-style: none; margin: 16px 0 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  .nutri li { padding: 18px 20px; background: rgba(237, 234, 224, 0.08); border-radius: 18px; }
  .nutri .n-head { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; color: var(--lime); }
  .nutri .n-dot { width: 10px; height: 10px; border-radius: 999px; background: var(--lime); flex-shrink: 0; }
  .nutri p { margin: 6px 0 0; font-size: 15px; line-height: 1.45; }
  @media (max-width: 820px) { .nutri ul { grid-template-columns: minmax(0, 1fr); } }

  .controls { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 24px; margin-top: 36px; }
  .filter-label { display: block; font-size: 15px; font-weight: 600; margin-bottom: 10px; }
  .filters { display: flex; flex-wrap: wrap; gap: 10px; }
  .filters button { min-height: 46px; padding: 0 20px; font-family: var(--body); font-size: 16px; font-weight: 700; color: var(--teal); background: transparent; border: 2px solid var(--teal); border-radius: 999px; cursor: pointer; }
  .filters button[aria-pressed="true"] { background: var(--teal); color: var(--cream); }
  .legend { display: flex; flex-wrap: wrap; gap: 14px 24px; max-width: 560px; font-size: 14px; }
  .legend div { display: flex; gap: 10px; align-items: flex-start; }

  .tag { flex-shrink: 0; display: inline-block; padding: 3px 10px; font-size: 13px; font-weight: 700; color: var(--teal); border-radius: 999px; }
  .tag-e { background: var(--lime); }
  .tag-s { background: var(--orange); }

  .print-locked { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 20px; padding: 14px 18px; background: #fff; border: 1px dashed var(--teal-soft); border-radius: 14px; font-size: 15px; }
  .print-locked svg { flex-shrink: 0; }
  .print-locked a { font-weight: 700; }

  .category { margin-top: 52px; }
  .category h2 { font-family: var(--display); font-weight: 700; font-size: clamp(28px, 4vw, 34px); letter-spacing: -0.5px; }
  .category .sub { margin: 4px 0 20px; font-size: 17px; color: var(--teal-soft); }
  .ideas { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
  .idea { display: flex; flex-direction: column; justify-content: space-between; gap: 16px; min-height: 164px; padding: 20px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; }
  .idea h3 { font-size: 19px; font-weight: 700; line-height: 1.25; }
  .idea p { margin: 8px 0 0; font-size: 15px; line-height: 1.45; color: #2F4642; }
  .idea-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
  .recipe { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; font-size: 15px; font-weight: 700; color: var(--teal); text-decoration: underline; text-underline-offset: 3px; }
  .recipe:hover { color: #0F2522; }
  .safety { margin: 44px 0 0; font-size: 14px; color: var(--teal-soft); max-width: 70ch; }

  /* Upsell */
  .upsell { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; margin: 56px 0 64px; }
  .panel { padding: clamp(28px, 4vw, 44px); border-radius: 28px; display: flex; flex-direction: column; gap: 16px; align-items: flex-start; }
  .panel h2 { font-family: var(--display); font-weight: 700; font-size: clamp(28px, 3.4vw, 38px); line-height: 1.1; letter-spacing: -0.5px; }
  .panel p { margin: 0; font-size: 18px; }
  .panel-fip { background: var(--teal); color: var(--cream); }
  .panel-vault { background: #fff; border: 3px solid var(--lime); }
  .panel-vault .eyebrow { font-size: 15px; font-weight: 700; color: var(--teal-soft); }
  .features { list-style: none; margin: 4px 0 8px; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .features li { display: flex; gap: 12px; align-items: flex-start; font-size: 17px; }
  .features svg { flex-shrink: 0; margin-top: 3px; }

  /* More-foods popup */
  dialog.more { width: min(520px, calc(100% - 32px)); padding: 0; border: none; border-radius: 28px; background: #fff; color: var(--teal); box-shadow: 0 24px 60px rgba(22, 51, 47, 0.28); }
  dialog.more::backdrop { background: rgba(22, 51, 47, 0.55); }
  .more-top { padding: 28px 32px 22px; background: var(--teal); color: var(--cream); }
  .more-top .eyebrow { font-size: 15px; font-weight: 700; color: var(--lime); }
  .more-top h2 { font-family: var(--display); font-weight: 800; font-size: 32px; line-height: 1.1; letter-spacing: -0.5px; margin-top: 6px; }
  .more-body { padding: 24px 32px 30px; display: flex; flex-direction: column; gap: 16px; }
  .more-body p { margin: 0; font-size: 17px; }
  .more-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 4px; }
  .btn-ghost { background: transparent; color: var(--teal); border: 2px solid var(--teal); }
  .more-close { position: absolute; top: 14px; right: 14px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; color: var(--cream); border: none; border-radius: 999px; cursor: pointer; }
  .more-close:hover { background: rgba(237, 234, 224, 0.15); }

  .site-footer { border-top: 1px solid #CFCBBE; padding: 24px 0 32px; font-size: 14px; color: var(--teal-soft); }

  @media (max-width: 1080px) {
    .food-grid, .ideas { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
  @media (max-width: 820px) {
    .food-grid, .ideas { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .upsell { grid-template-columns: minmax(0, 1fr); }
    .brand .divider, .header-link { display: none; }
  }
  @media (max-width: 540px) {
    body { font-size: 16px; }
    .wrap { padding: 0 18px; }
    .brand img { height: 48px; }
    .brand { gap: 10px; }
    .brand .tool { font-size: 18px; }
    .brand .divider { display: block; height: 30px; }
    .ideas { grid-template-columns: minmax(0, 1fr); }
    .idea { min-height: 0; }
    .food-grid a { min-height: 96px; padding: 16px; }
    .food-grid .name { font-size: 20px; }
    .search-row { flex-direction: column; }
    .search .btn { width: 100%; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .filters button, .food-grid a, .btn { transition: background-color .15s ease, border-color .15s ease; }
  }
</style>
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="#/" aria-label="Food Idea Planner home">
      <img src="assets/foodology-logo.png" alt="Foodology: Making food fun" width="578" height="281">
      <span class="divider" aria-hidden="true"></span>
      <span class="tool">Food Idea Planner</span>
    </a>
    <a class="header-link" id="website-link" href="#">Back to Foodology</a>
  </div>
</header>

<main id="app" class="wrap" tabindex="-1"></main>

<footer class="site-footer">
  <div class="wrap">
    <p style="margin:0">&copy; <span id="year"></span> Foodology Feeding Therapy. These ideas are general suggestions, not a substitute for individualized feeding therapy.</p>
  </div>
</footer>

<dialog class="more" id="more-dialog" aria-labelledby="more-title">
  <button class="more-close" type="button" id="more-close" aria-label="Close">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <div class="more-top">
    <span class="eyebrow">Inside Mission Vault</span>
    <h2 id="more-title">Want more foods?</h2>
  </div>
  <div class="more-body">
    <p id="more-text"></p>
    <ul class="features" id="more-features"></ul>
    <div class="more-actions">
      <a class="btn btn-lime" id="more-vault" href="#">Explore Mission Vault</a>
      <button class="btn btn-ghost" type="button" id="more-keep">Keep browsing free foods</button>
    </div>
  </div>
</dialog>

<script src="foods.js"></script>
<script>
  /* ======= Edit these links ======= */
  const CONFIG = {
    websiteUrl: "https://foodologyfeedingtherapy.com",
    fipUrl: "https://foodologyfeeding.mykajabi.com",      // Free 5-day Food Introduction Protocol landing page
    vaultUrl: "https://foodologyfeeding.mykajabi.com"     // Mission Vault sales page
  };
  /* ================================= */

  const app = document.getElementById("app");
  document.getElementById("website-link").href = CONFIG.websiteUrl;
  document.getElementById("year").textContent = new Date().getFullYear();

  let filter = "all";
  let lastSlug = null;

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const norm = (s) => s.toLowerCase().replace(/&/g, "and").replace(/[^a-z ]/g, "").replace(/\s+/g, " ").trim();
  const countIdeas = (food) => Object.values(food.ideas).reduce((n, list) => n + list.length, 0);

  const check = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  const ext = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>';
  const recipeUrl = (q) => "https://www.google.com/search?q=" + encodeURIComponent(q + " recipe kid friendly");
  const lock = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';

  function findFood(query) {
    const q = norm(query);
    if (!q) return null;
    return FOODS.find((f) => norm(f.name) === q || f.aliases.some((a) => norm(a) === q))
      || FOODS.find((f) => norm(f.name).includes(q) || q.includes(norm(f.name)) || f.aliases.some((a) => q.includes(norm(a))));
  }

  function searchForm(value) {
    return `
      <form class="search" id="search-form" role="search">
        <label for="food-search">Pick a food your child already loves</label>
        <div class="search-row">
          <input id="food-search" type="text" autocomplete="off" placeholder="Try chicken nuggets, apples, pasta..." value="${esc(value || "")}">
          <button class="btn btn-lime" type="submit">Show ideas</button>
        </div>
        <div id="search-result" aria-live="polite"></div>
      </form>`;
  }

  function upsell() {
    return `
      <section class="upsell" aria-label="Next steps">
        <div class="panel panel-fip">
          <h2>Ready to go beyond ideas?</h2>
          <p>The free 5-day Food Introduction Protocol shows you how to offer a new food step by step, without pressure or power struggles.</p>
          <a class="btn btn-lime" href="${CONFIG.fipUrl}">Start the free 5-day course</a>
        </div>
        <div class="panel panel-vault">
          <span class="eyebrow">Inside Mission Vault</span>
          <h2>Get the full Food Idea Planner</h2>
          <p>You can unlock the complete planner, made for real family life.</p>
          <ul class="features">
            <li>${check}<span>Ideas for any food your child eats, not just the 12 here</span></li>
            <li>${check}<span>Printable one-page versions to keep on the fridge</span></li>
            <li>${check}<span>A weekly idea planner to choose and plan what you'll try</span></li>
            <li>${check}<span>Plus every food science kit in the Vault</span></li>
          </ul>
          <a class="btn btn-teal" href="${CONFIG.vaultUrl}">Explore Mission Vault</a>
        </div>
      </section>`;
  }

  function renderHome() {
    const items = FOODS.map((f) => `
      <li><a href="#/food/${f.slug}"><span class="name">${esc(f.name)}</span><span class="count">${countIdeas(f)} ideas</span></a></li>`).join("");
    app.innerHTML = `
      <section class="home-hero">
        <h1>What does your child already love?</h1>
        <p>Eating the same few foods every day can feel exhausting, and it is not your fault. A food your child already loves is one of the best places to start. Pick one, and you'll get ideas for serving it in new ways and bringing its flavor into new foods.</p>
        ${searchForm("")}
        <ul class="food-grid" aria-label="Foods in the free planner">${items}</ul>
        <p class="free-note">The free planner includes 12 common favorites. Looking for a different food? <a href="${CONFIG.vaultUrl}">The full planner in Mission Vault covers any food.</a></p>
      </section>
      ${upsell()}`;
    bindSearch();
    document.title = "Food Idea Planner | Foodology Feeding Therapy";
  }

  function renderFood(food) {
    const all = CATEGORIES.flatMap((c) => food.ideas[c.key] || []);
    const easy = all.filter((i) => i.l === "e").length;
    const stretch = all.length - easy;
    const opts = [["all", `All ideas (${all.length})`], ["e", `Easy wins (${easy})`], ["s", `Bigger stretches (${stretch})`]];

    const sections = CATEGORIES.map((c) => {
      const ideas = (food.ideas[c.key] || []).filter((i) => filter === "all" || i.l === filter);
      if (!ideas.length) return "";
      return `
        <section class="category" aria-labelledby="cat-${c.key}">
          <h2 id="cat-${c.key}">${c.title}</h2>
          <p class="sub">${c.sub}</p>
          <ul class="ideas">
            ${ideas.map((i) => `
              <li class="idea">
                <div><h3>${esc(i.t)}</h3><p>${esc(i.tip)}</p></div>
                <div class="idea-foot">
                  <span class="tag tag-${i.l}">${i.l === "e" ? "Easy win" : "Bigger stretch"}</span>
                  ${i.r ? `<a class="recipe" href="${recipeUrl(i.r)}" target="_blank" rel="noopener" aria-label="Find a recipe for ${esc(i.t)} (opens in a new tab)">Find a recipe ${ext}</a>` : ""}
                </div>
              </li>`).join("")}
          </ul>
        </section>`;
    }).join("");

    app.innerHTML = `
      <a class="back" href="#/">All foods</a>
      <section class="food-hero">
        <span class="kicker">Your child loves</span>
        <h1 tabindex="-1" id="food-title">${esc(food.name)}</h1>
        <p>A food your child already loves is a real starting point. Here are ${all.length} ways ${esc(food.name.toLowerCase())} can show up in new places. You can pick just one idea for this week.</p>
        ${food.nutrition ? `
        <div class="nutri">
          <h2>What's great about ${esc(food.name.toLowerCase())}</h2>
          <ul>
            ${food.nutrition.map((n) => `<li><span class="n-head"><span class="n-dot" aria-hidden="true"></span>${esc(n.h)}</span><p>${esc(n.p)}</p></li>`).join("")}
          </ul>
        </div>` : ""}
      </section>
      <div class="controls">
        <div>
          <span class="filter-label" id="filter-label">Show me</span>
          <div class="filters" role="group" aria-labelledby="filter-label">
            ${opts.map(([id, label]) => `<button type="button" data-filter="${id}" aria-pressed="${filter === id}">${label}</button>`).join("")}
          </div>
        </div>
        <div class="legend">
          <div><span class="tag tag-e">Easy win</span><span>Stays close to what your child already knows.</span></div>
          <div><span class="tag tag-s">Bigger stretch</span><span>Changes more at once. Save these for a good day.</span></div>
          <div><span style="font-weight:700;text-decoration:underline;text-underline-offset:3px">Find a recipe</span><span>Cooking together lets kids get close to food with zero pressure to eat.</span></div>
        </div>
      </div>
      <div class="print-locked">${lock}<span>Want this page on your fridge? Printable versions are part of the full planner.</span><a href="${CONFIG.vaultUrl}">Get it in Mission Vault</a></div>
      ${sections}
      <p class="safety">Cut foods into small, age-appropriate pieces for young children, and always check ideas against your child's allergies and feeding needs.</p>
      ${upsell()}`;

    app.querySelectorAll("[data-filter]").forEach((b) => b.addEventListener("click", () => {
      filter = b.dataset.filter;
      renderFood(food);
      const next = app.querySelector(`[data-filter="${filter}"]`);
      if (next) next.focus();
    }));
    document.title = `${food.name} ideas | Food Idea Planner`;
  }

  function bindSearch() {
    const form = document.getElementById("search-form");
    if (!form) return;
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const value = document.getElementById("food-search").value;
      const out = document.getElementById("search-result");
      if (!value.trim()) { out.innerHTML = `<p class="search-msg">Type a food your child eats, or pick one below.</p>`; return; }
      const food = findFood(value);
      if (food) { location.hash = `#/food/${food.slug}`; return; }
      out.innerHTML = `<p class="search-msg"><strong>${esc(value.trim())}</strong> isn't in the free planner yet. You can pick one of the 12 foods below, or <a href="${CONFIG.vaultUrl}">get ideas for any food in the full planner inside Mission Vault</a>.</p>`;
      openMore(value.trim());
    });
  }

  const moreDialog = document.getElementById("more-dialog");
  document.getElementById("more-vault").href = CONFIG.vaultUrl;
  document.getElementById("more-features").innerHTML = [
    "Ideas for any food your child eats",
    "Food labs for over 16 different foods",
    "Printable versions and a weekly idea planner"
  ].map((t) => `<li>${check}<span>${t}</span></li>`).join("");
  const closeMore = () => moreDialog.close();
  document.getElementById("more-close").addEventListener("click", closeMore);
  document.getElementById("more-keep").addEventListener("click", closeMore);
  moreDialog.addEventListener("click", (e) => { if (e.target === moreDialog) closeMore(); });
  moreDialog.addEventListener("close", () => { const i = document.getElementById("food-search"); if (i) i.focus(); });

  function openMore(food) {
    document.getElementById("more-text").innerHTML =
      `<strong>${esc(food)}</strong> isn't in the free planner yet. If you want more foods, the full Food Idea Planner is available in Mission Vault, along with lots of other goodies.`;
    if (typeof moreDialog.showModal === "function") moreDialog.showModal();
  }

  function route() {
    const m = location.hash.match(/^#\/food\/([a-z-]+)/);
    const food = m && FOODS.find((f) => f.slug === m[1]);
    if (food) {
      if (food.slug !== lastSlug) filter = "all";
      lastSlug = food.slug;
      renderFood(food);
      window.scrollTo(0, 0);
      const t = document.getElementById("food-title");
      if (t) t.focus({ preventScroll: true });
    } else {
      lastSlug = null;
      renderHome();
      window.scrollTo(0, 0);
    }
  }

  window.addEventListener("hashchange", route);
  route();
</script>
</body>
</html>
